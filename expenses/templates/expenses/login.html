{% extends 'expenses/base.html' %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 text-primary fw-bold">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>تسجيل الدخول
                </h3>

                <form method="post">
                    {% csrf_token %}

                    {% if form.non_field_errors %}
                        <div class="alert alert-danger p-2 small">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" id="id_username" required>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-semibold">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">
                        دخول
                    </button>
                </form>

                <hr class="my-4">

                <p class="text-center mb-0 text-muted">
                    ليس لديك حساب؟ 
                    <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none">أنشئ حساباً جديداً</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
